services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-app
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-scheduler
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      - app
      - postgres
      - redis


  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-worker
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      - app
      - redis


  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-reverb
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan reverb:start
    restart: unless-stopped
    depends_on:
      - app
      - redis
    ports:
      - "8080:8080"


  nginx:
    image: nginx:alpine
    container_name: tms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


  postgres:
    image: postgres:16
    container_name: tms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: tms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"


  mailpit:
    image: axllent/mailpit
    container_name: tms-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:

  postgres_data: